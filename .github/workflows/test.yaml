name: Test

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Detect test-relevant changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            echo "push to main: always run"
            echo "python=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | \
             grep -qE '^(src/|tests/|examples/|pyproject\.toml$|uv\.lock$|\.github/workflows/test\.yaml$)'; then
            echo "Test-relevant paths changed"
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "No test-relevant changes"
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests with coverage
        run: uv run --group test pytest --cov=src/mixture_llm --cov-report=xml --cov-report=term

      - name: Upload coverage report
        if: matrix.python-version == '3.13' && github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@fd9adbdca9fdfbe2b9bfa44a7340e6a83346ce6c # v1.10.0
        with:
          pytest-xml-coverage-path: coverage.xml
          title: Coverage Report
          badge-title: coverage
          hide-badge: false
          hide-report: false
          remove-link-from-badge: true

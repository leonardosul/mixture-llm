name: Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test.yaml"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "pyproject.toml"

  pull_request:
    paths:
      - ".github/workflows/test.yaml"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov=src/mixture_llm --cov-report=xml --cov-report=term

      - name: Upload coverage report
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@46a1348587126fb199084ee9024ce511cb3abbdb # v1.4.0
        with:
          pytest-xml-coverage-path: coverage.xml
          title: Coverage Report
          badge-title: coverage
          hide-badge: false
          hide-report: false
          remove-link-from-badge: true
